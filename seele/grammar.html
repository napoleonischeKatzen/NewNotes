<!doctype html>
<html>
<head>
    <style>
        body
        .clickable {
            cursor: pointer;
            user-select: none;
            display: inline-block;
        }
        .clickable:hover {
            background: red;
        }
        .children {
            display: none;
        }
        .open > .children {
            display: block;
        }
        li:not(:has(> .children)) > .clickable::before {
            content: "";
        }
    </style>
</head>
<body>
<u>Irregular Words:</u>
<div class="container">
<ul>
  <li>
  <span class="clickable">Asia</span>
  <ul class="children">
    <li>
    <span class="clickable">Hebrew</span>
    <ul class="children">
      <li>Biblical-Hebrew</li>
      <li>Modern-Hebrew</li>
    </ul>
    </li>
  </ul>
  </li>
</ul>
</div>
</body>
<script>
    document.querySelectorAll(".clickable").forEach(item => {
        item.addEventListener("click", function () {
            const parent = this.parentElement;
            if (parent.querySelector(":scope > .children")) {
                parent.classList.toggle("open");
            }
        });
    });
</script>
</html>
